<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>公司内部门户 · 工作台导航</title>
<!--
  ══════════════════════════════════════════════════════════════
  公司内部门户 · 静态导航页
  如何新增/修改入口：找到下方 SYSTEMS 数组，按格式增删即可
  {
    name: '系统名称',
    desc: '一句话说明',
    url: 'https://...',      // 跳转地址
    icon: '🎯',              // 图标（emoji）
    group: 'core',           // core=核心业务 / support=支撑系统 / plan=筹备中
    badge: '在线' / '内网' / '筹备中'
  }
  ══════════════════════════════════════════════════════════════
-->
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #111830;
    --card: #151d38;
    --card-hover: #1b2547;
    --border: rgba(255,255,255,.08);
    --text: #eef2ff;
    --text-dim: #8b93ad;
    --accent: #4f7cff;
    --accent-2: #22d3ee;
    --green: #34d399;
    --amber: #fbbf24;
    --gray: #6b7280;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(79,124,255,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(34,211,238,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 48px 24px 64px; }

  /* ── Header ── */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 40px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: 0 8px 24px rgba(79,124,255,.35);
  }
  .brand h1 { font-size: 22px; letter-spacing: .5px; }
  .brand p { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
  .clock { text-align: right; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  .clock b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }

  /* ── Search ── */
  .search-box { position: relative; margin-bottom: 36px; }
  .search-box input {
    width: 100%; padding: 14px 18px 14px 46px; font-size: 15px;
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); outline: none; transition: .2s;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,124,255,.15); }
  .search-box .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; }

  /* ── Group ── */
  .group-title { display: flex; align-items: center; gap: 10px; margin: 34px 0 16px; font-size: 15px; font-weight: 600; color: var(--text-dim); letter-spacing: 1px; }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .group-title .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── Cards ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .card {
    position: relative; display: flex; gap: 16px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px;
    transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    opacity: 0; transition: .2s;
  }
  .card:hover:not(.disabled) { transform: translateY(-4px); background: var(--card-hover); border-color: rgba(79,124,255,.45); box-shadow: 0 14px 32px rgba(0,0,0,.35); }
  .card:hover:not(.disabled)::before { opacity: 1; }
  .card .emoji {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 12px; font-size: 25px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(79,124,255,.12); border: 1px solid rgba(79,124,255,.2);
  }
  .card h3 { font-size: 16.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card p { font-size: 13.5px; color: var(--text-dim); line-height: 1.65; }
  .card .url-hint { margin-top: 10px; font-size: 12px; color: #55618a; word-break: break-all; }

  .badge { font-size: 11px; padding: 2.5px 9px; border-radius: 99px; font-weight: 500; }
  .badge.online { color: var(--green); background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.3); }
  .badge.intranet { color: var(--amber); background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.3); }
  .badge.plan { color: var(--gray); background: rgba(107,114,128,.12); border: 1px solid rgba(107,114,128,.3); }

  .card.disabled { opacity: .55; cursor: not-allowed; }
  .arrow { margin-left: auto; align-self: center; color: var(--text-dim); transition: .2s; flex-shrink: 0; }
  .card:hover:not(.disabled) .arrow { color: var(--accent); transform: translateX(4px); }

  .empty { text-align: center; color: var(--text-dim); padding: 48px 0; display: none; }

  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-dim); flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--accent-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🐟</div>
      <div>
        <h1>公司内部门户</h1>
        <p>业务系统统一入口 · One Portal</p>
      </div>
    </div>
    <div class="clock">
      <div><b id="clock-time">--:--:--</b></div>
      <div id="clock-date">----</div>
    </div>
  </header>

  <div class="search-box">
    <span class="icon">🔍</span>
    <input id="search" type="text" placeholder="搜索工作台 / 系统，如：运营、供应链、培训…" />
  </div>

  <div id="groups"></div>
  <div class="empty" id="empty">没有匹配的系统，换个关键词试试～</div>

  <footer>
    <span>内部门户 · 仅限公司内部使用</span>
    <span>入口有变动？联系 <a href="#">管理员</a> 更新本页</span>
  </footer>
</div>

<script>
  // ══════════ 系统入口配置（增删改这里即可）══════════
  const GROUPS = [
    { key: 'core',    label: '核心业务系统', color: '#4f7cff' },
    { key: 'support', label: '支撑系统',     color: '#22d3ee' },
    { key: 'plan',    label: '筹备中',       color: '#6b7280' },
  ];

  const SYSTEMS = [
    // ── 核心业务 ──
    {
      name: '运营工作台', icon: '🚀', group: 'core', badge: '内网',
      desc: '闲鱼运营全套工具：选品分析、内容改写、账号运营、爆品方法论',
      url: 'http://localhost:5180',
    },
    {
      name: '培训内容工作台', icon: '📚', group: 'core', badge: '内网',
      desc: '知识付费交付协同：售前交接、入班诊断、交付计划、课程体系',
      url: 'http://localhost:5180/knowledgepay/workspace',
    },
    {
      name: '供应链工作台', icon: '📦', group: 'core', badge: '筹备中',
      desc: '鲸选供应链 · 三大类目供应链对接与货源管理',
      url: '#',
    },
    // ── 支撑系统 ──
    {
      name: '闲鱼运营手册', icon: '📖', group: 'support', badge: '内网',
      desc: '运营 SOP 手册与团队工作台（本地 SQLite 版）',
      url: 'http://localhost:5173',
    },
    {
      name: 'Xianyu-OS 知识库', icon: '🧠', group: 'support', badge: '在线',
      desc: '运营中心 / Lab / 内容改写 知识系统（线上版）',
      url: 'https://daiguangjiu.github.io/lab/',
    },
    {
      name: '投放平台（大鱼动力）', icon: '📣', group: 'support', badge: '在线',
      desc: '闲鱼官方推广：超强擦亮、黄金首位、线索通',
      url: 'https://dayu.goofish.com',
    },
    // ── 筹备中 ──
    {
      name: '数据看板', icon: '📊', group: 'plan', badge: '筹备中',
      desc: '出单率、毕业率、账号矩阵数据统一可视化',
      url: '#',
    },
    {
      name: '客服工单系统', icon: '🎫', group: 'plan', badge: '筹备中',
      desc: '学员咨询、售后工单流转与退款预警',
      url: '#',
    },
  ];
  // ═══════════════════════════════════════════════

  const groupsEl = document.getElementById('groups');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');

  const badgeClass = { '在线': 'online', '内网': 'intranet', '筹备中': 'plan' };

  function render(keyword = '') {
    const kw = keyword.trim().toLowerCase();
    let hasAny = false;
    groupsEl.innerHTML = '';

    GROUPS.forEach(g => {
      const items = SYSTEMS.filter(s => s.group === g.key &&
        (!kw || (s.name + s.desc).toLowerCase().includes(kw)));
      if (!items.length) return;
      hasAny = true;

      const section = document.createElement('div');
      section.innerHTML = `
        <div class="group-title">
          <span class="dot" style="background:${g.color}"></span>${g.label}
        </div>
        <div class="grid"></div>`;
      const grid = section.querySelector('.grid');

      items.forEach(s => {
        const disabled = s.badge === '筹备中';
        const a = document.createElement('a');
        a.className = 'card' + (disabled ? ' disabled' : '');
        a.href = s.url;
        if (!disabled) a.target = '_blank';
        a.innerHTML = `
          <div class="emoji">${s.icon}</div>
          <div style="flex:1;min-width:0">
            <h3>${s.name}<span class="badge ${badgeClass[s.badge] || 'plan'}">${s.badge}</span></h3>
            <p>${s.desc}</p>
            <div class="url-hint">${s.url === '#' ? '即将上线' : s.url}</div>
          </div>
          <span class="arrow">›</span>`;
        grid.appendChild(a);
      });
      groupsEl.appendChild(section);
    });

    emptyEl.style.display = hasAny ? 'none' : 'block';
  }

  searchEl.addEventListener('input', e => render(e.target.value));
  render();

  // 时钟
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    document.getElementById('clock-time').textContent =
      `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    const week = ['日','一','二','三','四','五','六'][d.getDay()];
    document.getElementById('clock-date').textContent =
      `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${week}`;
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
